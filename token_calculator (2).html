<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Calculator</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Simple Trash2 and Plus icons
        const Trash2 = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
        );

        const Plus = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        );

        function TokenCalculator() {
            const [numBuyins, setNumBuyins] = useState('');
            const [players, setPlayers] = useState([]);
            const [buyinAmount, setBuyinAmount] = useState(10);

            const TOKENS_PER_BUYIN = 500;
            const DOLLARS_PER_BUYIN = buyinAmount;
            const DOLLAR_PER_TOKEN = DOLLARS_PER_BUYIN / TOKENS_PER_BUYIN;

            const totalAvailableTokens = numBuyins ? parseInt(numBuyins) * TOKENS_PER_BUYIN : 0;
            const totalTokensEntered = players.reduce((sum, p) => sum + (parseInt(p.tokens) || 0), 0);
            const tokensRemaining = totalAvailableTokens - totalTokensEntered;

            const handleAddPlayer = () => {
                setPlayers([...players, { id: Date.now(), name: '', tokens: '' }]);
            };

            const handleUpdatePlayer = (id, field, value) => {
                setPlayers(players.map(p =>
                    p.id === id ? { ...p, [field]: value } : p
                ));
            };

            const handleDeletePlayer = (id) => {
                setPlayers(players.filter(p => p.id !== id));
            };

            const calculatePlayMoney = (tokens) => {
                const numTokens = parseInt(tokens) || 0;
                return (numTokens * DOLLAR_PER_TOKEN).toFixed(2);
            };

            const isBalanced = totalAvailableTokens > 0 && tokensRemaining === 0;
            const hasOverage = tokensRemaining < 0;

            return (
                <>
                    <style>{`
                        input:focus {
                            outline: none;
                            border-color: #d4af37 !important;
                            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
                        }
                        
                        button:hover {
                            transform: translateY(-2px);
                            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
                        }
                        
                        @media (max-width: 600px) {
                            .setup-grid {
                                grid-template-columns: 1fr !important;
                            }
                            .player-inputs { 
                                grid-template-columns: 1fr !important; 
                            }
                            .summary-grid { 
                                grid-template-columns: 1fr !important; 
                            }
                            .stats-grid { 
                                grid-template-columns: 1fr !important; 
                            }
                            .player-card { 
                                flex-direction: column; 
                                align-items: stretch !important; 
                                padding: 12px;
                            }
                            .result-section { 
                                flex-direction: column;
                                width: 100%;
                                gap: 12px;
                            }
                            .result-item { 
                                align-items: flex-start !important; 
                                width: 100%;
                            }
                            .delete-btn { 
                                align-self: flex-end;
                                min-width: unset;
                                min-height: unset;
                                padding: 10px;
                            }
                        }
                    `}</style>
                    <div style={styles.container}>
                        <div style={styles.header}>
                            <h1 style={styles.title}>Token Calculator</h1>
                            <p style={styles.subtitle}>Convert game tokens to play money</p>
                        </div>

                        <div style={styles.setupSection}>
                            <div style={styles.setupCard}>
                                <div style={styles.setupGrid} className="setup-grid">
                                    <div>
                                        <label style={styles.label}>Buy-in Amount ($)</label>
                                        <input
                                            type="number"
                                            min="1"
                                            step="0.50"
                                            value={buyinAmount}
                                            onChange={(e) => setBuyinAmount(parseFloat(e.target.value) || 10)}
                                            style={styles.input}
                                            placeholder="10"
                                        />
                                    </div>
                                    <div>
                                        <label style={styles.label}>Number of Buyins</label>
                                        <input
                                            type="number"
                                            min="0"
                                            value={numBuyins}
                                            onChange={(e) => setNumBuyins(e.target.value)}
                                            style={styles.input}
                                            placeholder="Enter number of players"
                                        />
                                    </div>
                                </div>
                                {numBuyins && (
                                    <div style={styles.stats} className="stats-grid">
                                        <div style={styles.statItem}>
                                            <span style={styles.statLabel}>Total Tokens in Play:</span>
                                            <span style={styles.statValue}>{totalAvailableTokens.toLocaleString()}</span>
                                        </div>
                                        <div style={styles.statItem}>
                                            <span style={styles.statLabel}>Per Buyin:</span>
                                            <span style={styles.statValue}>{TOKENS_PER_BUYIN} tokens = ${DOLLARS_PER_BUYIN}</span>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        {numBuyins && (
                            <>
                                <div style={styles.playersHeader}>
                                    <h2 style={styles.sectionTitle}>Player Settlements</h2>
                                    <button onClick={handleAddPlayer} style={styles.addButton}>
                                        <Plus size={18} />
                                        <span style={{ marginLeft: '6px' }}>Add Player</span>
                                    </button>
                                </div>

                                <div style={styles.playersContainer}>
                                    {players.length === 0 ? (
                                        <div style={styles.emptyState}>
                                            <p style={styles.emptyText}>No players added yet</p>
                                            <p style={styles.emptySubtext}>Click "Add Player" to start entering tokens</p>
                                        </div>
                                    ) : (
                                        players.map((player) => (
                                            <div key={player.id} style={styles.playerCard} className="player-card">
                                                <div style={styles.playerInputs} className="player-inputs">
                                                    <div style={styles.inputGroup}>
                                                        <label style={styles.inputLabel}>Player Name (optional)</label>
                                                        <input
                                                            type="text"
                                                            value={player.name}
                                                            onChange={(e) => handleUpdatePlayer(player.id, 'name', e.target.value)}
                                                            style={styles.playerNameInput}
                                                            placeholder="Player name"
                                                        />
                                                    </div>
                                                    <div style={styles.inputGroup}>
                                                        <label style={styles.inputLabel}>Tokens</label>
                                                        <input
                                                            type="number"
                                                            min="0"
                                                            value={player.tokens}
                                                            onChange={(e) => handleUpdatePlayer(player.id, 'tokens', e.target.value)}
                                                            style={styles.tokensInput}
                                                            placeholder="0"
                                                        />
                                                    </div>
                                                </div>

                                                <div style={styles.resultSection} className="result-section">
                                                    <div style={styles.resultItem} className="result-item">
                                                        <span style={styles.resultLabel}>Play Money</span>
                                                        <span style={styles.resultValue}>
                                                            ${calculatePlayMoney(player.tokens)}
                                                        </span>
                                                    </div>
                                                    <button
                                                        onClick={() => handleDeletePlayer(player.id)}
                                                        style={styles.deleteButton}
                                                        title="Remove player"
                                                        className="delete-btn"
                                                    >
                                                        <Trash2 size={18} />
                                                    </button>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>

                                {players.length > 0 && (
                                    <div style={styles.summarySection} className="summary-grid">
                                        <div style={{
                                            ...styles.summaryCard,
                                            borderLeftColor: isBalanced ? '#10b981' : hasOverage ? '#ef4444' : '#f59e0b'
                                        }}>
                                            <div style={styles.summaryRow}>
                                                <span style={styles.summaryLabel}>Total Tokens Entered:</span>
                                                <span style={styles.summaryValue}>{totalTokensEntered.toLocaleString()}</span>
                                            </div>
                                            <div style={styles.summaryRow}>
                                                <span style={styles.summaryLabel}>Total Available:</span>
                                                <span style={styles.summaryValue}>{totalAvailableTokens.toLocaleString()}</span>
                                            </div>
                                            <div style={styles.summaryDivider} />
                                            <div style={styles.summaryRow}>
                                                <span style={styles.summaryLabel}>
                                                    {hasOverage ? '❌ Overage:' : '✓ Remaining:'}
                                                </span>
                                                <span style={{
                                                    ...styles.summaryValue,
                                                    color: hasOverage ? '#ef4444' : '#666'
                                                }}>
                                                    {Math.abs(tokensRemaining).toLocaleString()}
                                                </span>
                                            </div>
                                            {isBalanced && (
                                                <div style={styles.balancedBadge}>✓ Perfectly Balanced</div>
                                            )}
                                        </div>

                                        <div style={styles.totalPayoutCard}>
                                            <span style={styles.totalPayoutLabel}>Total Payout:</span>
                                            <span style={styles.totalPayoutValue}>
                                                ${(totalTokensEntered * DOLLAR_PER_TOKEN).toFixed(2)}
                                            </span>
                                        </div>
                                    </div>
                                )}
                            </>
                        )}
                    </div>
                </>
            );
        }

        const styles = {
            container: {
                maxWidth: '1200px',
                margin: '0 auto',
                padding: '20px 16px 40px',
                background: 'linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%)',
                minHeight: '100vh',
                fontFamily: 'inherit',
            },
            header: {
                textAlign: 'center',
                marginBottom: '48px',
                paddingBottom: '32px',
                borderBottom: '3px solid #d4af37',
            },
            title: {
                fontSize: 'clamp(48px, 12vw, 64px)',
                fontWeight: '900',
                margin: '0 0 16px 0',
                color: '#d4af37',
                textShadow: '4px 4px 8px rgba(0,0,0,0.7)',
                letterSpacing: '3px',
            },
            subtitle: {
                fontSize: '18px',
                color: '#cbd5e1',
                margin: 0,
                fontStyle: 'italic',
                fontWeight: '300',
            },
            setupSection: {
                marginBottom: '48px',
            },
            setupCard: {
                background: 'linear-gradient(135deg, rgba(31, 41, 55, 0.95) 0%, rgba(17, 24, 39, 0.95) 100%)',
                border: '3px solid #d4af37',
                borderRadius: '16px',
                padding: '40px',
                boxShadow: '0 30px 60px rgba(0, 0, 0, 0.5)',
            },
            setupGrid: {
                display: 'grid',
                gridTemplateColumns: '1fr 1fr',
                gap: '32px',
            },
            label: {
                display: 'block',
                fontSize: '16px',
                fontWeight: '800',
                color: '#d4af37',
                marginBottom: '12px',
                textTransform: 'uppercase',
                letterSpacing: '2px',
            },
            input: {
                width: '100%',
                padding: '18px 18px',
                fontSize: '20px',
                border: '2px solid #374151',
                borderRadius: '10px',
                fontFamily: 'inherit',
                marginBottom: '20px',
                background: 'rgba(0, 0, 0, 0.3)',
                color: '#e5e7eb',
                transition: 'all 0.3s',
                fontWeight: '600',
            },
            stats: {
                display: 'grid',
                gridTemplateColumns: '1fr 1fr',
                gap: '24px',
                marginTop: '24px',
                padding: '24px',
                background: 'rgba(212, 175, 55, 0.1)',
                borderRadius: '10px',
                borderLeft: '6px solid #d4af37',
            },
            statItem: {
                display: 'flex',
                flexDirection: 'column',
                gap: '8px',
            },
            statLabel: {
                fontSize: '14px',
                color: '#9ca3af',
                textTransform: 'uppercase',
                letterSpacing: '1px',
                fontWeight: '600',
            },
            statValue: {
                fontSize: '32px',
                fontWeight: '800',
                color: '#d4af37',
                fontFamily: '"Menlo", "Monaco", monospace',
            },
            playersHeader: {
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center',
                marginBottom: '28px',
                paddingBottom: '16px',
                borderBottom: '2px solid rgba(212, 175, 55, 0.3)',
            },
            sectionTitle: {
                fontSize: '28px',
                fontWeight: '800',
                margin: 0,
                color: '#d4af37',
                letterSpacing: '2px',
            },
            addButton: {
                display: 'flex',
                alignItems: 'center',
                padding: '16px 32px',
                fontSize: '18px',
                fontWeight: '800',
                background: 'linear-gradient(135deg, #d4af37 0%, #f4d03f 100%)',
                color: '#1a1a1a',
                border: 'none',
                borderRadius: '10px',
                cursor: 'pointer',
                transition: 'all 0.3s',
                minHeight: '52px',
                textTransform: 'uppercase',
                letterSpacing: '2px',
            },
            playersContainer: {
                display: 'flex',
                flexDirection: 'column',
                gap: '16px',
                marginBottom: '40px',
            },
            emptyState: {
                textAlign: 'center',
                padding: '60px 30px',
                background: 'linear-gradient(135deg, rgba(31, 41, 55, 0.95) 0%, rgba(17, 24, 39, 0.95) 100%)',
                borderRadius: '16px',
                border: '3px dashed #d4af37',
            },
            emptyText: {
                fontSize: '20px',
                fontWeight: '700',
                color: '#d4af37',
                margin: '0 0 10px 0',
            },
            emptySubtext: {
                fontSize: '16px',
                color: '#9ca3af',
                margin: 0,
            },
            playerCard: {
                background: 'linear-gradient(135deg, rgba(31, 41, 55, 0.95) 0%, rgba(17, 24, 39, 0.95) 100%)',
                border: '2px solid #374151',
                borderLeft: '6px solid #d4af37',
                borderRadius: '14px',
                padding: '24px',
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center',
                gap: '24px',
                boxShadow: '0 15px 40px rgba(0, 0, 0, 0.4)',
                transition: 'all 0.3s',
            },
            playerInputs: {
                flex: 1,
                display: 'grid',
                gridTemplateColumns: '2fr 1fr',
                gap: '16px',
            },
            inputGroup: {
                display: 'flex',
                flexDirection: 'column',
                gap: '8px',
            },
            inputLabel: {
                fontSize: '13px',
                fontWeight: '700',
                color: '#a0aec0',
                textTransform: 'uppercase',
                letterSpacing: '1px',
            },
            playerNameInput: {
                padding: '14px 14px',
                fontSize: '18px',
                border: '2px solid #374151',
                borderRadius: '8px',
                fontFamily: 'inherit',
                background: 'rgba(0, 0, 0, 0.3)',
                color: '#e5e7eb',
                fontWeight: '500',
            },
            tokensInput: {
                padding: '14px 14px',
                fontSize: '18px',
                border: '2px solid #374151',
                borderRadius: '8px',
                fontFamily: '"Menlo", "Monaco", monospace',
                textAlign: 'right',
                background: 'rgba(0, 0, 0, 0.3)',
                color: '#e5e7eb',
                fontWeight: '600',
            },
            resultSection: {
                display: 'flex',
                alignItems: 'center',
                gap: '16px',
                minWidth: '200px',
            },
            resultItem: {
                display: 'flex',
                flexDirection: 'column',
                alignItems: 'flex-end',
                gap: '6px',
                flex: 1,
            },
            resultLabel: {
                fontSize: '12px',
                color: '#9ca3af',
                textTransform: 'uppercase',
                letterSpacing: '1px',
                fontWeight: '600',
            },
            resultValue: {
                fontSize: '32px',
                fontWeight: '900',
                color: '#22c55e',
                fontFamily: '"Menlo", "Monaco", monospace',
                textShadow: '0 0 15px rgba(34, 197, 94, 0.4)',
            },
            deleteButton: {
                padding: '12px 12px',
                minWidth: '48px',
                minHeight: '48px',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                background: 'rgba(239, 68, 68, 0.2)',
                border: '2px solid #ef4444',
                borderRadius: '8px',
                cursor: 'pointer',
                color: '#ef4444',
                transition: 'all 0.2s',
            },
            summarySection: {
                display: 'grid',
                gridTemplateColumns: '1fr',
                gap: '20px',
            },
            summaryCard: {
                background: 'linear-gradient(135deg, rgba(31, 41, 55, 0.95) 0%, rgba(17, 24, 39, 0.95) 100%)',
                border: '2px solid #374151',
                borderLeft: '6px solid #f59e0b',
                borderRadius: '14px',
                padding: '28px',
                boxShadow: '0 15px 40px rgba(0, 0, 0, 0.4)',
            },
            summaryRow: {
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center',
                padding: '14px 0',
            },
            summaryLabel: {
                fontSize: '16px',
                color: '#a0aec0',
                fontWeight: '700',
            },
            summaryValue: {
                fontSize: '22px',
                fontWeight: '800',
                color: '#e5e7eb',
                fontFamily: '"Menlo", "Monaco", monospace',
            },
            summaryDivider: {
                height: '2px',
                background: 'rgba(212, 175, 55, 0.2)',
                margin: '16px 0',
            },
            balancedBadge: {
                marginTop: '16px',
                padding: '12px 16px',
                background: 'rgba(34, 197, 94, 0.2)',
                color: '#22c55e',
                borderRadius: '8px',
                fontSize: '14px',
                fontWeight: '800',
                textAlign: 'center',
                border: '2px solid #22c55e',
                textTransform: 'uppercase',
                letterSpacing: '1px',
            },
            totalPayoutCard: {
                background: 'linear-gradient(135deg, #d4af37 0%, #f4d03f 100%)',
                color: '#1a1a1a',
                borderRadius: '14px',
                padding: '36px',
                display: 'flex',
                flexDirection: 'column',
                justifyContent: 'center',
                alignItems: 'center',
                gap: '12px',
                boxShadow: '0 30px 60px rgba(212, 175, 55, 0.5)',
                marginTop: '20px',
            },
            totalPayoutLabel: {
                fontSize: '18px',
                fontWeight: '900',
                textTransform: 'uppercase',
                letterSpacing: '2px',
                opacity: 0.9,
            },
            totalPayoutValue: {
                fontSize: '56px',
                fontWeight: '900',
                fontFamily: '"Menlo", "Monaco", monospace',
                letterSpacing: '2px',
            },
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<TokenCalculator />);
    </script>
</body>
</html>
