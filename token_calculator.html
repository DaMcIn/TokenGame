<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Calculator</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Simple Trash2 and Plus icons
        const Trash2 = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
        );

        const Plus = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        );

        function TokenCalculator() {
            const [numBuyins, setNumBuyins] = useState('');
            const [players, setPlayers] = useState([]);

            const TOKENS_PER_BUYIN = 500;
            const DOLLARS_PER_BUYIN = 10;
            const DOLLAR_PER_TOKEN = DOLLARS_PER_BUYIN / TOKENS_PER_BUYIN;

            const totalAvailableTokens = numBuyins ? parseInt(numBuyins) * TOKENS_PER_BUYIN : 0;
            const totalTokensEntered = players.reduce((sum, p) => sum + (parseInt(p.tokens) || 0), 0);
            const tokensRemaining = totalAvailableTokens - totalTokensEntered;

            const handleAddPlayer = () => {
                setPlayers([...players, { id: Date.now(), name: '', tokens: '' }]);
            };

            const handleUpdatePlayer = (id, field, value) => {
                setPlayers(players.map(p =>
                    p.id === id ? { ...p, [field]: value } : p
                ));
            };

            const handleDeletePlayer = (id) => {
                setPlayers(players.filter(p => p.id !== id));
            };

            const calculatePlayMoney = (tokens) => {
                const numTokens = parseInt(tokens) || 0;
                return (numTokens * DOLLAR_PER_TOKEN).toFixed(2);
            };

            const isBalanced = totalAvailableTokens > 0 && tokensRemaining === 0;
            const hasOverage = tokensRemaining < 0;

            return (
                <>
                    <style>{`
                        @media (max-width: 600px) {
                            .player-inputs { 
                                grid-template-columns: 1fr !important; 
                            }
                            .summary-grid { 
                                grid-template-columns: 1fr !important; 
                            }
                            .stats-grid { 
                                grid-template-columns: 1fr !important; 
                            }
                            .player-card { 
                                flex-direction: column; 
                                align-items: stretch !important; 
                                padding: 12px;
                            }
                            .result-section { 
                                flex-direction: column;
                                width: 100%;
                                gap: 12px;
                            }
                            .result-item { 
                                align-items: flex-start !important; 
                                width: 100%;
                            }
                            .delete-btn { 
                                align-self: flex-end;
                                min-width: unset;
                                min-height: unset;
                                padding: 10px;
                            }
                        }
                    `}</style>
                    <div style={styles.container}>
                        <div style={styles.header}>
                            <h1 style={styles.title}>Token Calculator</h1>
                            <p style={styles.subtitle}>Convert game tokens to play money</p>
                        </div>

                        <div style={styles.setupSection}>
                            <div style={styles.setupCard}>
                                <label style={styles.label}>Number of Buyins</label>
                                <input
                                    type="number"
                                    min="0"
                                    value={numBuyins}
                                    onChange={(e) => setNumBuyins(e.target.value)}
                                    style={styles.input}
                                    placeholder="Enter number of players"
                                />
                                {numBuyins && (
                                    <div style={styles.stats} className="stats-grid">
                                        <div style={styles.statItem}>
                                            <span style={styles.statLabel}>Total Tokens in Play:</span>
                                            <span style={styles.statValue}>{totalAvailableTokens.toLocaleString()}</span>
                                        </div>
                                        <div style={styles.statItem}>
                                            <span style={styles.statLabel}>Per Buyin:</span>
                                            <span style={styles.statValue}>{TOKENS_PER_BUYIN} tokens = ${DOLLARS_PER_BUYIN}</span>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        {numBuyins && (
                            <>
                                <div style={styles.playersHeader}>
                                    <h2 style={styles.sectionTitle}>Player Settlements</h2>
                                    <button onClick={handleAddPlayer} style={styles.addButton}>
                                        <Plus size={18} />
                                        <span style={{ marginLeft: '6px' }}>Add Player</span>
                                    </button>
                                </div>

                                <div style={styles.playersContainer}>
                                    {players.length === 0 ? (
                                        <div style={styles.emptyState}>
                                            <p style={styles.emptyText}>No players added yet</p>
                                            <p style={styles.emptySubtext}>Click "Add Player" to start entering tokens</p>
                                        </div>
                                    ) : (
                                        players.map((player) => (
                                            <div key={player.id} style={styles.playerCard} className="player-card">
                                                <div style={styles.playerInputs} className="player-inputs">
                                                    <div style={styles.inputGroup}>
                                                        <label style={styles.inputLabel}>Player Name (optional)</label>
                                                        <input
                                                            type="text"
                                                            value={player.name}
                                                            onChange={(e) => handleUpdatePlayer(player.id, 'name', e.target.value)}
                                                            style={styles.playerNameInput}
                                                            placeholder="Player name"
                                                        />
                                                    </div>
                                                    <div style={styles.inputGroup}>
                                                        <label style={styles.inputLabel}>Tokens</label>
                                                        <input
                                                            type="number"
                                                            min="0"
                                                            value={player.tokens}
                                                            onChange={(e) => handleUpdatePlayer(player.id, 'tokens', e.target.value)}
                                                            style={styles.tokensInput}
                                                            placeholder="0"
                                                        />
                                                    </div>
                                                </div>

                                                <div style={styles.resultSection} className="result-section">
                                                    <div style={styles.resultItem} className="result-item">
                                                        <span style={styles.resultLabel}>Play Money</span>
                                                        <span style={styles.resultValue}>
                                                            ${calculatePlayMoney(player.tokens)}
                                                        </span>
                                                    </div>
                                                    <button
                                                        onClick={() => handleDeletePlayer(player.id)}
                                                        style={styles.deleteButton}
                                                        title="Remove player"
                                                        className="delete-btn"
                                                    >
                                                        <Trash2 size={18} />
                                                    </button>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>

                                {players.length > 0 && (
                                    <div style={styles.summarySection} className="summary-grid">
                                        <div style={{
                                            ...styles.summaryCard,
                                            borderLeftColor: isBalanced ? '#10b981' : hasOverage ? '#ef4444' : '#f59e0b'
                                        }}>
                                            <div style={styles.summaryRow}>
                                                <span style={styles.summaryLabel}>Total Tokens Entered:</span>
                                                <span style={styles.summaryValue}>{totalTokensEntered.toLocaleString()}</span>
                                            </div>
                                            <div style={styles.summaryRow}>
                                                <span style={styles.summaryLabel}>Total Available:</span>
                                                <span style={styles.summaryValue}>{totalAvailableTokens.toLocaleString()}</span>
                                            </div>
                                            <div style={styles.summaryDivider} />
                                            <div style={styles.summaryRow}>
                                                <span style={styles.summaryLabel}>
                                                    {hasOverage ? '❌ Overage:' : '✓ Remaining:'}
                                                </span>
                                                <span style={{
                                                    ...styles.summaryValue,
                                                    color: hasOverage ? '#ef4444' : '#666'
                                                }}>
                                                    {Math.abs(tokensRemaining).toLocaleString()}
                                                </span>
                                            </div>
                                            {isBalanced && (
                                                <div style={styles.balancedBadge}>✓ Perfectly Balanced</div>
                                            )}
                                        </div>

                                        <div style={styles.totalPayoutCard}>
                                            <span style={styles.totalPayoutLabel}>Total Payout:</span>
                                            <span style={styles.totalPayoutValue}>
                                                ${(totalTokensEntered * DOLLAR_PER_TOKEN).toFixed(2)}
                                            </span>
                                        </div>
                                    </div>
                                )}
                            </>
                        )}
                    </div>
                </>
            );
        }

        const styles = {
            container: {
                maxWidth: '900px',
                margin: '0 auto',
                padding: 'clamp(12px, 4vw, 24px) 16px',
                background: '#fafafa',
                minHeight: '100vh',
            },
            header: {
                textAlign: 'center',
                marginBottom: '32px',
            },
            title: {
                fontSize: 'clamp(24px, 6vw, 32px)',
                fontWeight: '700',
                margin: '0 0 8px 0',
                color: '#1a1a1a',
            },
            subtitle: {
                fontSize: '14px',
                color: '#666',
                margin: 0,
            },
            setupSection: {
                marginBottom: '32px',
            },
            setupCard: {
                background: '#fff',
                border: '1px solid #e5e5e5',
                borderRadius: '8px',
                padding: '18px',
            },
            label: {
                display: 'block',
                fontSize: '13px',
                fontWeight: '600',
                color: '#333',
                marginBottom: '8px',
                textTransform: 'uppercase',
                letterSpacing: '0.5px',
            },
            input: {
                width: '100%',
                padding: '14px 14px',
                fontSize: '16px',
                border: '1px solid #ddd',
                borderRadius: '6px',
                fontFamily: 'inherit',
                marginBottom: '16px',
            },
            stats: {
                display: 'grid',
                gridTemplateColumns: '1fr 1fr',
                gap: '16px',
                marginTop: '16px',
            },
            statItem: {
                display: 'flex',
                flexDirection: 'column',
                gap: '4px',
            },
            statLabel: {
                fontSize: '12px',
                color: '#888',
            },
            statValue: {
                fontSize: '18px',
                fontWeight: '600',
                color: '#1a1a1a',
                fontFamily: '"Menlo", "Monaco", monospace',
            },
            playersHeader: {
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center',
                marginBottom: '16px',
            },
            sectionTitle: {
                fontSize: '18px',
                fontWeight: '600',
                margin: 0,
                color: '#1a1a1a',
            },
            addButton: {
                display: 'flex',
                alignItems: 'center',
                padding: '12px 20px',
                fontSize: '15px',
                fontWeight: '500',
                background: '#1a1a1a',
                color: '#fff',
                border: 'none',
                borderRadius: '6px',
                cursor: 'pointer',
                transition: 'background 0.2s',
                minHeight: '44px',
            },
            playersContainer: {
                display: 'flex',
                flexDirection: 'column',
                gap: '12px',
                marginBottom: '24px',
            },
            emptyState: {
                textAlign: 'center',
                padding: '40px 20px',
                background: '#fff',
                borderRadius: '8px',
                border: '1px solid #e5e5e5',
            },
            emptyText: {
                fontSize: '16px',
                fontWeight: '500',
                color: '#666',
                margin: '0 0 6px 0',
            },
            emptySubtext: {
                fontSize: '13px',
                color: '#999',
                margin: 0,
            },
            playerCard: {
                background: '#fff',
                border: '1px solid #e5e5e5',
                borderRadius: '8px',
                padding: '16px',
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'flex-end',
                gap: '16px',
            },
            playerInputs: {
                flex: 1,
                display: 'grid',
                gridTemplateColumns: '1fr 150px',
                gap: '12px',
            },
            inputGroup: {
                display: 'flex',
                flexDirection: 'column',
                gap: '6px',
            },
            inputLabel: {
                fontSize: '12px',
                fontWeight: '600',
                color: '#666',
                textTransform: 'uppercase',
                letterSpacing: '0.3px',
            },
            playerNameInput: {
                padding: '12px 12px',
                fontSize: '16px',
                border: '1px solid #ddd',
                borderRadius: '6px',
                fontFamily: 'inherit',
            },
            tokensInput: {
                padding: '12px 12px',
                fontSize: '16px',
                border: '1px solid #ddd',
                borderRadius: '6px',
                fontFamily: '"Menlo", "Monaco", monospace',
                textAlign: 'right',
            },
            resultSection: {
                display: 'flex',
                alignItems: 'flex-end',
                gap: '12px',
            },
            resultItem: {
                display: 'flex',
                flexDirection: 'column',
                alignItems: 'flex-end',
                gap: '4px',
                minWidth: '120px',
            },
            resultLabel: {
                fontSize: '12px',
                color: '#888',
                textTransform: 'uppercase',
                letterSpacing: '0.3px',
            },
            resultValue: {
                fontSize: '20px',
                fontWeight: '700',
                color: '#1a1a1a',
                fontFamily: '"Menlo", "Monaco", monospace',
            },
            deleteButton: {
                padding: '12px 12px',
                minWidth: '44px',
                minHeight: '44px',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                background: '#f5f5f5',
                border: '1px solid #ddd',
                borderRadius: '6px',
                cursor: 'pointer',
                color: '#999',
                transition: 'all 0.2s',
            },
            summarySection: {
                display: 'grid',
                gridTemplateColumns: '1fr 1fr',
                gap: '16px',
            },
            summaryCard: {
                background: '#fff',
                border: '1px solid #e5e5e5',
                borderLeft: '4px solid #f59e0b',
                borderRadius: '8px',
                padding: '16px',
            },
            summaryRow: {
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center',
                padding: '8px 0',
            },
            summaryLabel: {
                fontSize: '13px',
                color: '#666',
                fontWeight: '500',
            },
            summaryValue: {
                fontSize: '16px',
                fontWeight: '600',
                color: '#1a1a1a',
                fontFamily: '"Menlo", "Monaco", monospace',
            },
            summaryDivider: {
                height: '1px',
                background: '#e5e5e5',
                margin: '8px 0',
            },
            balancedBadge: {
                marginTop: '12px',
                padding: '8px 12px',
                background: '#ecfdf5',
                color: '#047857',
                borderRadius: '6px',
                fontSize: '12px',
                fontWeight: '600',
                textAlign: 'center',
            },
            totalPayoutCard: {
                background: '#1a1a1a',
                color: '#fff',
                borderRadius: '8px',
                padding: '16px',
                display: 'flex',
                flexDirection: 'column',
                justifyContent: 'flex-end',
                alignItems: 'flex-end',
                gap: '8px',
            },
            totalPayoutLabel: {
                fontSize: '12px',
                opacity: 0.7,
                textTransform: 'uppercase',
                letterSpacing: '0.3px',
            },
            totalPayoutValue: {
                fontSize: '28px',
                fontWeight: '700',
                fontFamily: '"Menlo", "Monaco", monospace',
            },
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<TokenCalculator />);
    </script>
</body>
</html>
